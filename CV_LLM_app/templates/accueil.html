<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de CV - IA</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Bebas+Neue&family=Dosis:wght@200..800&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=McLaren&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Traitement CV avec LLM</h1>

    <div class="upload-card">
        <h2>Upload des CVs</h2>
        <div class="dropzone" id="dropzone">
            <p>Glissez vos fichiers ici ou <span class="link">parcourir</span></p>
            <input type="file" id="files" multiple accept=".pdf,.docx" hidden>
        </div>
        <button id="submit">Sauvegarder et Analyser</button>
        <div id="status"></div>
    </div>
</div>

<div id="status"></div>
</div> <div class="chat-card" style="margin-top: 30px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
    <h2>Discuter avec les CVs</h2>
    <div id="chat-history" style="min-height: 100px; margin-bottom: 20px; border: 1px solid #eee; padding: 10px; border-radius: 8px;">
        <p style="color: #888; font-style: italic;">Posez une question, ex: "Qui a de l'expérience en Python ?"</p>
    </div>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="prompt-input" placeholder="Votre question..." style="flex: 1; padding: 10px; border: 2px solid #cbd5e0; border-radius: 8px;">
        <button id="send-btn" style="width: auto;">Envoyer</button>
    </div>
</div>

<div id="zone-resultat" style="display: none; margin: 30px auto; max-width: 800px;">

<div id="zone-resultat" style="display: none; margin: 30px auto; max-width: 800px;">
</div>

<script src="/static/front.js"></script>
</body>
</html>
